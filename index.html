led>=2){subs.forEach(s=>{try{s[2]&&s[2](e)}catch(_){}})}}\n  }\n  setInterval(()=>{if(!document.hidden)pull()},POLL);\n  document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});\n  const db={\n    collection(c){return {onSnapshot(next,err){subs.push([c,next,err]);if(ready)setTimeout(()=>next(snap(c)),0);else if(subs.length===1)pull();return ()=>{}}}},\n    doc(p){const i=p.indexOf('/'),c=p.slice(0,i),id=p.slice(i+1);return {\n      async set(d){await call('POST',{op:'set',c:c,id:id,d:JSON.stringify(d),by:lg('nb.me')||''});cache.set(p,JSON.parse(JSON.stringify(d)));fire()},\n      async delete(){await call('POST',{op:'del',c:c,id:id,by:lg('nb.me')||''});cache.delete(p);fire()}}}\n  };\n  async function askName(){\n    return new Promise(res=>{\n      const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:99999;display:flex;align-items:center;justify-content:center;font-family:inherit';\n      o.innerHTML='\u003cform style=\"background:#fff;color:#1b2430;padding:22px;border-radius:12px;width:min(360px,92vw);box-shadow:0 10px 40px rgba(0,0,0,.3)\">\u003ch3 style=\"margin:0 0 6px;font-size:16px\">이름을 선택하세요\u003c/h3>\u003cp style=\"margin:0 0 12px;font-size:12px;color:#5a6676\">입력 기록과 업무 지시에 이 이름이 남습니다. 목록에 없으면 직접 적으세요.\u003c/p>\u003cinput list=\"nbp\" required style=\"width:100%;box-sizing:border-box;padding:9px;font-size:14px;border:1px solid #b8c2cf;border-radius:8px\" placeholder=\"이름\">\u003cdatalist id=\"nbp\">'+PEOPLE.map(p=>'\u003coption value=\"'+p+'\">').join('')+'\u003c/datalist>\u003cbutton style=\"margin-top:14px;width:100%;padding:10px;font-size:14px;border:0;border-radius:8px;background:#124e66;color:#fff;cursor:pointer\">시작\u003c/button>\u003c/form>';\n      document.body.appendChild(o);\n      o.querySelector('form').onsubmit=e=>{e.preventDefault();const v=o.querySelector('input').value.trim();if(v){ls('nb.me',v);o.remove();res(v)}};\n    });\n  }\n  const user={async me(){let n=lg('nb.me');if(!n){if(document.readyState==='loading')await new Promise(r=>document.addEventListener('DOMContentLoaded',r));n=await askName()}return {name:n,id:n}},async can(){return true},async id(){return lg('nb.me')||''}};\n  const dl={async save(x){const b=new Blob([x.data],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=x.filename||'download.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);return {status:'saved'}}};\n  window.claude={use:async n=>({db:db,user:user,downloads:dl})[n]||null};\n})();\n\u003c/script>\n\u003cdiv class=\"top\">\n  \u003cdiv>\u003ch2>To Do List\u003c/h2>\u003cdiv class=\"sub\" id=\"sub\">업무를 지시하고 진행 상황을 함께 확인합니다.\u003c/div>\u003c/div>\n  \u003cdiv class=\"me\">\u003clabel for=\"me\">사용자\u003c/label>\u003cselect id=\"me\">\u003c/select>\u003cspan class=\"badge\" id=\"role\" hidden>관리자\u003c/span>\u003cspan class=\"dot\" title=\"실시간 동기화\">\u003c/span>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"kp\" id=\"kp\">\u003c/div>\n\u003cdiv class=\"bar\">\n  \u003cbutton class=\"b p\" id=\"new\">＋ 업무 지시\u003c/button>\n  \u003cselect id=\"fa\">\u003c/select>\n  \u003cinput id=\"q\" type=\"search\" placeholder=\"업무·메모 검색\" style=\"min-width:180px\">\n  \u003cspan class=\"sp\">\u003c/span>\u003cspan class=\"mut\" id=\"cnt\">\u003c/span>\n\u003c/div>\n\u003cform class=\"form\" id=\"form\" hidden>\n  \u003ch3 id=\"fh\">업무 지시\u003c/h3>\n  \u003clabel>업무 제목\u003cinput id=\"ft\" required maxlength=\"120\" placeholder=\"예: 0150-100-0592 납기 컨택\">\u003c/label>\n  \u003clabel>상세 내용\u003ctextarea id=\"fd\" placeholder=\"요청 내용, 참고 자료, 기대 결과\">\u003c/textarea>\u003c/label>\n  \u003cdiv class=\"fr\">\n    \u003clabel>마감일\u003cinput id=\"fdue\" type=\"date\">\u003c/label>\n    \u003clabel>우선순위\u003cselect id=\"fp\">\u003coption value=\"h\">높음\u003c/option>\u003coption value=\"m\" selected>보통\u003c/option>\u003coption value=\"l\">낮음\u003c/option>\u003c/select>\u003c/label>\n  \u003c/div>\n  \u003clabel>담당자 \u003cspan id=\"fan\" class=\"mut\">\u003c/span>\u003c/label>\u003cdiv class=\"chk\" id=\"fas\">\u003c/div>\n  \u003cdiv style=\"display:flex;gap:8px\">\u003cbutton class=\"b p\" type=\"submit\" id=\"fs\">저장\u003c/button>\u003cbutton class=\"b\" type=\"button\" id=\"fc\">취소\u003c/button>\u003c/div>\n\u003c/form>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>우선순위\u003c/th>\u003cth style=\"min-width:240px\">업무\u003c/th>\u003cth>담당자\u003c/th>\u003cth>지시자\u003c/th>\u003cth>마감\u003c/th>\u003cth>상태\u003c/th>\u003cth style=\"min-width:200px\">처리 메모\u003c/th>\u003cth>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"tb\">\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"toast\" id=\"toast\">\u003c/div>\n\u003cscript>\n(async function(){\nconst ADMINS=['최성현','김민','이기환','김태희'];\nconst TEAM=['최성현','김민','이기환','김태희','이준영','박형식','조재완','이주희','김혜린','김형수','김소현','신승희','이민정','김지은','황가람','박소영'];\nconst ST=['대기','진행 중','완료'];\nconst $=id=>document.getElementById(id);\nconst esc=s=>String(s==null?'':s).replace(/[&\u003c>\"]/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nconst lg=k=>{try{return localStorage.getItem(k)}catch(e){return null}};\nconst ls=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};\nlet ME=lg('nb.me')||'',T=[],F={st:'',a:'all',q:'',edit:null},db=null,ready=false;\nconst isAdm=()=>ADMINS.includes(ME);\nconst today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};\nconst dd=s=>Math.round((Date.parse(s+'T00:00:00Z')-Date.parse(today()+'T00:00:00Z'))/864e5);\nfunction toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}\nfunction fillMe(){const L=[...new Set([...TEAM,...(ME&&!TEAM.includes(ME)?[ME]:[])])];$('me').innerHTML='\u003coption value=\"\">(선택)\u003c/option>'+L.map(n=>`\u003coption value=\"${esc(n)}\"${n===ME?' selected':''}>${esc(n)}${(({'황가람':'사업관리','박소영':'사업관리'})[n]?' ('+({'황가람':'사업관리','박소영':'사업관리'})[n]+')':'')}\u003c/option>`).join('');$('role').hidden=!isAdm();$('role').textContent=ME==='이기환'?'마스터':'관리자';\n  $('fa').innerHTML='\u003coption value=\"all\">담당자 전체\u003c/option>'+(ME?'\u003coption value=\"me\"'+(F.a==='me'?' selected':'')+'>내 업무\u003c/option>':'')+TEAM.map(n=>`\u003coption value=\"${esc(n)}\"${F.a===n?' selected':''}>${esc(n)}${(({'황가람':'사업관리','박소영':'사업관리'})[n]?' ('+({'황가람':'사업관리','박소영':'사업관리'})[n]+')':'')}\u003c/option>`).join('')}\n$('me').onchange=e=>{ME=e.target.value;ls('nb.me',ME);if(ME&&F.a==='all'&&!isAdm())F.a='me';fillMe();render()};\nconst late=t=>t.st!==2&&t.due&&dd(t.due)\u003c0;\nfunction vis(){const q=F.q.trim().toLowerCase();return T.filter(t=>{\n  if(F.st==='late'){if(!late(t))return false}else if(F.st!==''&&String(t.st)!==F.st)return false;\n  if(F.a==='me'){if(t.to!==ME)return false}else if(F.a!=='all'&&t.to!==F.a)return false;\n  if(q&&!(t.title+' '+(t.desc||'')+' '+(t.memo||'')+' '+t.to).toLowerCase().includes(q))return false;return true})}\nfunction sorted(a){const p={h:0,m:1,l:2};return a.slice().sort((x,y)=>{const dx=x.due||'9999',dy=y.due||'9999';return ((x.st===2)-(y.st===2))||(dx\u003cdy?-1:dx>dy?1:0)||(p[x.pr]-p[y.pr])||(y.cr-x.cr)})}\nfunction render(){\n  const base=T.filter(t=>F.a==='me'?t.to===ME:(F.a==='all'||t.to===F.a));\n  const c=[base.length,base.filter(t=>t.st===0).length,base.filter(t=>t.st===1).length,base.filter(t=>t.st===2).length,base.filter(late).length];\n  const K=[['','전체','k1'],['0','대기','k2'],['1','진행 중','k2'],['2','완료','k3'],['late','기한 초과','k4']];\n  $('kp').innerHTML=K.map((k,i)=>`\u003cbutton class=\"kc ${k[2]} ${F.st===k[0]?'on':''}\" data-s=\"${k[0]}\">\u003cspan class=\"l\">${k[1]}\u003c/span>\u003cspan class=\"n\">${c[i]}\u003c/span>\u003c/button>`).join('');\n  const rows=sorted(vis());$('cnt').textContent=rows.length+'건';\n  if(!ready){$('tb').innerHTML='\u003ctr>\u003ctd colsp n\u003cscript>\n/* 구글 시트 저장소 연결 (Apps Script 웹앱). 아래 두 값만 채우면 됩니다. */\n(function(){\n  const GS_URL=window.GS_URL||'';   // 예: https://script.google.com/macros/s/XXXX/exec\n  const GS_KEY=window.GS_KEY||'';   // Code.gs 의 KEY 와 같은 값\n  const POLL=window.GS_POLL||8000;\n  if(!GS_URL||!GS_KEY){console.warn('GS_URL/GS_KEY 가 비어 있어 조회 전용으로 열립니다.');return}\n  const PEOPLE=['이준영','박형식','조재완','이주희','김혜린','김형수','김태희','김소현','신승희','이민정','김지은','최성현','김민','이기환','황가람'];\n  const cache=new Map(),subs=[];let since=0,ready=false,failed=0;\n  function lg(k){try{return localStorage.getItem(k)}catch(e){return null}}\n  function ls(k,v){try{localStorage.setItem(k,v)}catch(e){}}\n  function snap(c){\n    const docs=[];cache.forEach((v,k)=>{if(k.indexOf(c+'/')===0)docs.push({id:k.slice(c.length+1),exists:true,data:()=>JSON.parse(JSON.stringify(v))})});\n    return {docs:docs,size:docs.length,empty:!docs.length};\n  }\n  function fire(){subs.forEach(s=>{try{s[1](snap(s[0]))}catch(e){console.error(e)}})}\n  async function call(method,body){\n    const url=GS_URL+(method==='GET'?'?key='+encodeURIComponent(GS_KEY)+'&since='+since:'');\n    const r=await fetch(url,method==='GET'?{}:{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({key:GS_KEY},body))});\n    const j=await r.json();if(!j.ok)throw new Error(j.error||'서버 오류');return j;\n  }\n  async function pull(){\n    try{\n      const j=await call('GET');\n      let ch=false;\n      (j.docs||[]).forEach(d=>{\n        const k=d.c+'/'+d.id;\n        if(d.d===''||d.d==null){if(cache.delete(k))ch=true}\n        else{const v=JSON.parse(d.d);if(JSON.stringify(cache.get(k))!==d.d){cache.set(k,v);ch=true}}\n        if(d.u>since)since=d.u;\n      });\n      if(j.now&&!since)since=j.now;\n      failed=0;\n      if(ch||!ready){ready=true;fire()}\n    }catch(e){failed++;if(!ready&&failed>=2){subs.forEach(s=>{try{s[2]&&s[2](e)}catch(_){}})}}\n  }\n  setInterval(()=>{if(!document.hidden)pull()},POLL);\n  d >규칙·설정\u003c/button>\n  \u003c/div>\n  \u003cdiv class=\"gbar\" id=\"gbar\">\u003clabel for=\"gb\">담당자\u003c/label>\u003cselect id=\"gb\" aria-label=\"담당자\">\u003c/select>\u003clabel for=\"gt\">기준일\u003c/label>\u003cinput type=\"date\" id=\"gt\">\u003cbutton class=\"btn\" id=\"gtoday\" type=\"button\">오늘로\u003c/button>\u003cspan class=\"cnt\">기준일을 바꾸면 모든 화면의 컨택일이 다시 계산됩니다.\u003c/span>\u003c/div>\n\n  \u003csection id=\"vdash\">\n    \u003cdiv class=\"warn\" id=\"warn\">\u003c/div>\n    \u003cdiv class=\"kp\" id=\"kp\">\u003c/div>\n    \u003cdiv class=\"two\">\n      \u003cdiv class=\"card\">\u003ch2>월별 부족 자재 \u003csmall>처음 부족해지는 달 기준 · 필요 시점은 그 달 15일 · 막대를 누르면 그 달 자재 목록으로 이동\u003c/small>\u003c/h2>\u003cdiv class=\"mch\" id=\"mchart\">\u003c/div>\u003cdiv class=\"lg\" id=\"mlg\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"card ov\">\u003cdiv class=\"ovh\">\u003cb>판정별 자재\u003c/b>\u003cspan>부족 자재 1개 = 판정 1개\u003c/span>\u003c/div>\u003cdiv class=\"stk\" id=\"stk\">\u003c/div>\u003cdiv id=\"stt\" class=\"ctw\" style=\"margin-top:12px\">\u003c/div>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"two\">\n      \u003cdiv class=\"card\">\u003ch2>담당자별 현황 \u003csmall>행을 누르면 그 담당자의 자재 목록으로 이동합니다.\u003c/small>\u003c/h2>\u003cdiv id=\"tb\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"card\">\u003ch2>제품군별 현황 \u003csmall>행을 누르면 그 제품군의 자재 목록으로 이동합니다.\u003c/small>\u003c/h2>\u003cdiv id=\"tp\">\u003c/div>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"card\">\u003ch2>먼저 처리할 자재 \u003csmall>납기경과 → 일정 지연 → 수량·미발주 순, 같은 판정에서는 필요 시점이 빠른 순 · 상위 10개 · 행을 누르면 목록에서 찾아 줍니다.\u003c/small>\u003c/h2>\u003cdiv id=\"toptbl\">\u003c/div>\u003c/div>\n  \u003c/section>\n\n  \u003csection id=\"vlist\" hidden>\n    \u003cdiv class=\"bar wrapbar\" id=\"lbar\">\u003c/div>\n    \u003cdiv id=\"mmon\">\u003c/div>\n    \u003cp class=\"hint\" id=\"mhint\">\u003c/p>\n    \u003cdiv class=\"tw\">\u003ctable class=\"g\" id=\"tbl\">\u003c/table>\u003c/div>\n    \u003cdiv class=\"pager\" id=\"mpager\">\u003c/div>\n  \u003c/section>\n\n  \u003csection id=\"vout\" hidden>\n    \u003cdiv class=\"opbar\" id=\"ocfg\">\u003c/div>\n    \u003cp class=\"hint\">결품 자재 목록의 열·판정·담당자를 골라 그대로 출력합니다. 엑셀·PDF·인쇄에 같은 내용이 들어갑니다. 열을 많이 고르면 글자가 작아지니 A3 가로를 쓰거나 열을 줄여 보세요. 값을 고치면(구매영역 입력 등) 이 화면도 바로 다시 만들어집니다.\u003c/p>\n    \u003cdiv id=\"opv\">\u003c/div>\n  \u003c/section>\n\n  \u003csection id=\"vrule\" hidden>\n    \u003cdiv class=\"card\">\u003ch2>설정 \u003csmall>값을 바꾸면 모든 화면의 컨택일이 바로 다시 계산되고 팀 전체에 반영됩니다.\u003c/small>\u003c/h2>\n      \u003cdiv class=\"form\">\n        \u003clabel>사전 확인 1 (납기 며칠 전)\u003cinput type=\"number\" id=\"c1\" min=\"1\" max=\"60\">\u003c/label>\n        \u003clabel>사전 확인 2 (납기 며칠 전)\u003cinput type=\"number\" id=\"c2\" min=\"1\" max=\"60\">\u003c/label>\n        \u003clabel>기본 리드타임 (주) · 업체 이력 없을 때\u003cinput type=\"number\" id=\"ltw\" min=\"1\" max=\"60\">\u003c/label>\n        \u003clabel>견적 회신 대기 (일)\u003cinput type=\"number\" id=\"rfq\" min=\"0\" max=\"30\">\u003c/label>\n      \u003c/div>\u003c/div>\n    \u003cdiv class=\"card\">\u003ch2>컨택일을 정하는 규칙\u003c/h2>\u003cdiv class=\"ctw\">\u003ctable class=\"ct\" id=\"ruletbl\">\u003c/table>\u003c/div>\u003c/div>\n    \u003cdiv class=\"card\">\u003ch2>이 초안의 한계\u003c/h2>\u003cul class=\"lim\" id=\"limits\">\u003c/ul>\u003c/div>\n  \u003c/section>\n\u003c/div>\n\u003cdiv id=\"tip\" role=\"tooltip\" style=\"position:fixed;z-index:95;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:6px;pointer-events:none;max-width:260px;display:none;line-height:1.45;white-space:pre-line\">\u003c/div>\n\u003cdiv class=\"mbg\" id=\"mbg\" hidden>\u003cdiv class=\"mdl\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"mt\">\u003ch3 id=\"mt\">\u003c/h3>\u003cdiv class=\"mbody\" id=\"mb\">\u003c/div>\u003cdiv class=\"mact\" id=\"ma\">\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"toast\" id=\"toast\" role=\"status\" hidden>\u003c/div>\n\u003cscript src=\"https://cdn.jsdelivr.net/npm/xlsx-js-st .indexOf('overdue'),cm=H.indexOf('미납');\n      if(ci\u003c0||cn\u003c0||co\u003c0||cm\u003c0)continue;\n      if(!best||rows.length>best.rows.length)best={sn,h,rows,H,ci,cn,co,cm};\n    }\n  }\n  if(!best)return null;\n  const {rows,H,h}=best;\n  const zc=[best.cm];let from=best.cm;\n  for(const k of ['미발주','합','재공결품','gemba결품','입고요청월','부적합','반품','sht','합계']){const i=H.indexOf(k,from+1);if(i\u003c0)return null;zc.push(i);from=i}\n  const cu=H.indexOf('단위'),cp=H.indexOf('제품군');\n  const first=rows.slice(h+1).find(r=>String(r[best.ci]).trim());\n  const pc=first&&isNaN(+first[cp])&&String(first[cp]).trim()?cp:cp+1;\n  const months=rows[h].slice(best.co,best.co+8).map(x=>String(x).trim());\n  const seen=new Set(),mats=[];\n  for(let i=h+1;i\u003crows.length;i++){\n    const r=rows[i],id=String(r[best.ci]).trim();if(!id||seen.has(id))continue;seen.add(id);\n    const nz=v=>{const x=+v;return v===''||isNaN(x)?0:x};\n    const z=zc.map((c,k)=>k===3||k===4?String(r[c]??'').trim():k===5?(r[c]===''?'':(isNaN(+r[c])?String(r[c]).trim():+r[c])):nz(r[c]));\n    mats.push({id,n:String(r[best.cn]).trim(),u:String(r[cu]).trim(),p:String(r[pc]).trim(),z,s:months.map((_,k)=>nz(r[best.co+k]))});\n  }\n  return {sn:best.sn,months,mats};\n}\nfunction prodDiff(P){\n  const cur=new Map(MS.map(m=>[m.id,m])),nw=new Set(P.mats.map(m=>m.id)),nl=labelsOf(P.months);\n  const added=P.mats.filter(m=>!cur.has(m.id)),removed=MS.filter(m=>!nw.has(m.id)),ch=[];\n  const zl=['미납','미발주','합','재공결품','Gemba결품','입고요청월','부적합','반품','SHT','합계'],ex=v=>v===''?'공란':v;\n  for(const p of P.mats){\n    const m=cur.get(p.id);if(!m)continue;const d=[];\n    [['n','자재내역'],['u','단위'],['p','제품군']].forEach(([k,l])=>{if(m[k]!==p[k])d.push(l+' '+m[k]+'→'+p[k])});\n    p.z.forEach((v,i)=>{if(String(m.z[i])!==String(v))d.push(zl[i]+' '+ex(m.z[i])+'→'+ex(v))});\n    p.s.forEach((v,i)=>{if(Math.abs((m.s[i]||0)-v)>1e-6)d.push('재고 '+nl[i]+' '+(Math.round((m.s[i]||0)*100)/100)+'→'+(Math.round(v*100)/100))});\n    if(d.length)ch. var loaded={},K=['todo','sales','six'],cur='todo',locked=true;
var TEAM=['최성현','김민','김태희','이기환','이준영','박형식','조재완','이주희','김혜린','김형수','김소현','신승희','이민정','김지은','황가람','박소영'];
var ROLE={'이기환':'master','최성현':'admin','김민':'admin','김태희':'admin'},RN={master:'마스터',admin:'관리자',user:'일반'},SUB={'황가람':'사업관리','박소영':'사업관리'};
var SALT='HUNEED-AERO-PORTAL-2610',ACL={"최성현": "36c253c7beb996f3a90213aaeae15ebfc916582054b4d6155b411b0691997190", "김민": "b881f83daa77b746bac95f520b3c4b44537598ede2bfcae1d6a094f4e6b76bc9", "김태희": "3555fd5d67988130f0c0a0cab57da34f84d42670fadae46169af5044cedd96b4", "이기환": "0836e66bfd0d0cd684eb56dc0c16311bb69276accb5bd910a909dfe80ab76f9c", "이준영": "d29daa8b4e30c9211d15a5081b0a4e684bae3aab3edb39990bbb2c56a7f59371", "박형식": "1efa47848b87e30b71697b0c843e7a7d18d6750a36040dccd00932c87a11addc", "조재완": "64bb9b2ba4161d84e1fd31be04940cbb2cec35c93c3ed6548bf96da94acd8199", "이주희": "5caef7bd1ed8910dd85eebeba48be9108a101ed1a117075444a7772de3532e4c", "김혜린": "09609cf7c8a1887ddee8feb0671435a7852f05f17416a95e518fbef78d97aa60", "김형수": "5c07e35771134c0101be10f6cc540f3fee718a38405b063651542220e26c879a", "김소현": "0264a023aec005e044b28fea77026c787568ac544b716c0fd400c1827e4ff755", "신승희": "f4e7cbd126830e389f39cec608d858cb5174ffb7744250dc9207368daae7696c", "이민정": "6a004ef58e1592fc42c7883a6b838ff267195e6437ae30b75061836fce7cdc32", "김지은": "21b72d2118bbd9cf253d59b8fdf11a718ec1a372ba7c63f9fc513ef0f5f1e37d", "황가람": "32079cb109148322030cebad42719a6d4920efa4a0b4f77757a697f4424bd3ba", "박소영": "363615e363e4061eb90d90e7ab9b6665577f2eb0065b20776712106f61cf93b2"},AUTH=null;
function role(n){return ROLE[n]||'user'}
function sha256(ascii){function r(n,x){return(n>>>x)|(n<<(32-x))}const mp=Math.pow,maxW=mp(2,32);let res="",words=[],bl=ascii.length*8,i,j;
  let h=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],pl=k.length;const isC={};
  for(let c=2;pl<64;c++){if(!isC[c]){for(i=0;i<313;i+=c)isC[i]=c;h[pl]=(mp(c,.5)*maxW)|0;k[pl++]=(mp(c,1/3)*maxW)|0}}
  ascii+="\x80";while(ascii.length%64-56)ascii+="\x00";
  for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);words[i>>2]|=j<<((3-i)%4)*8}
  words[words.length]=((bl/maxW)|0);words[words.length]=(bl);
  let hash=h.slice(0,8);
  for(j=0;j<words.length;){const w=words.slice(j,j+=16),oh=hash;hash=hash.slice(0,8);
    for(i=0;i<64;i++){const w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];
      const t1=hash[7]+(r(e,6)^r(e,11)^r(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(r(w15,7)^r(w15,18)^(w15>>>3))+w[i-7]+(r(w2,17)^r(w2,19)^(w2>>>10)))|0);
      const t2=(r(a,2)^r(a,13)^r(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0}
    for(i=0;i<8;i++)hash[i]=(hash[i]+oh[i])|0}
  for(i=0;i<8;i++)for(j=3;j+1;j--){const b=(hash[i]>>(j*8))&255;res+=((b<16)?0:"")+b.toString(16)}return res}
function lg(k){try{return sessionStorage.getItem(k)||''}catch(e){return ''}}
function ls(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var SHIM='<script>(function(){try{var ls=window.localStorage,ss=parent.sessionStorage,K={"nb.me":1,"ms.me":1};var w={getItem:function(k){return K[k]?ss.getItem(k):ls.getItem(k)},setItem:function(k,v){K[k]?ss.setItem(k,v):ls.setItem(k,v)},removeItem:function(k){K[k]?ss.removeItem(k):ls.removeItem(k)},clear:function(){ls.clear()},key:function(i){return ls.key(i)},get length(){return ls.length}};Object.defineProperty(window,"localStorage",{configurable:true,get:function(){return w}})}catch(e){}})();<\/script>';
SHIM+='<script>setInterval(function(){var e=document.getElementById("me");if(e&&!e.disabled){e.disabled=true;e.title="로그인한 사용자로 고정됩니다"}},300)<\/script>';
function load(k){ if(loaded[k])return; loaded[k]=1;
  $('f-'+k).srcdoc=JSON.parse($('p-'+k).textContent).replace(/<head[^>]*>/,function(m){return m+SHIM});
}
function show(k){
  if(locked)return;
  cur=k;
  K.forEach(function(x){
    $('f-'+x).hidden=(x!==k);
    $('t-'+x).setAttribute('aria-selected',x===k?'true':'false');
  });
  load(k);
  try{history.replaceState(null,'','#'+k)}catch(e){}
}
document.querySelectorAll('nav button').forEach(function(b){b.addEventListener('click',function(){show(b.dataset.k)})});
/* ---- 사용자 잠금 ---- */
function lock(){locked=true;AUTH=null;if($('mk'))$('mk').hidden=true;$('who').hidden=true;hidePop();$('gate').classList.add('on');document.querySelector('.shell').setAttribute('inert','');
  K.forEach(function(x){loaded[x]=0;$('f-'+x).srcdoc='';$('f-'+x).hidden=true});
  seen={};firstDone=false;pend=[];lastT=null;
  try{sessionStorage.removeItem('nb.me');sessionStorage.removeItem('ms.me')}catch(e){}
  $('lp').value='';$('lm').textContent='';$('ln').focus&&setTimeout(function(){$('ln').focus()},50)}
function unlock(name){
  AUTH={n:name,r:role(name)};ls('nb.me',name);ls('ms.me',name);locked=false;
  $('gate').classList.remove('on');document.querySelector('.shell').removeAttribute('inert');
  var w=$('who');w.querySelector('b').textContent=name+' 님';w.querySelector('em').textContent=RN[AUTH.r];w.hidden=false;
  show('todo');adm();
}
$('ln').innerHTML='<option value="">이름 선택</option>'+TEAM.map(function(n){return '<option value="'+esc(n)+'">'+esc(n)+(SUB[n]?' ('+esc(SUB[n])+')':'')+'</option>'}).join('');
var fails=0,lockUntil=0;
$('lf').addEventListener('submit',function(e){e.preventDefault();
  var n=$('ln').value,pw=$('lp').value.replace(/\s/g,''),m=$('lm');
  if(Date.now()<lockUntil){m.textContent='잠시 후 다시 시도하세요 ('+Math.ceil((lockUntil-Date.now())/1000)+'초)';return}
  if(!n){m.textContent='이름을 선택하세요.';return}
  if(!pw){m.textContent='사번을 입력하세요.';return}
  if(ACL[n]&&ACL[n]===sha256(SALT+pw)){fails=0;m.textContent='';$('lp').value='';unlock(n)}
  else{fails++;$('lp').select();
    if(fails>=5){lockUntil=Date.now()+30000;fails=0;m.textContent='5회 실패했습니다. 30초 후 다시 시도하세요.'}
    else m.textContent='이름 또는 사번이 맞지 않습니다. ('+fails+'/5)'}
});
$('lo').onclick=function(){lock();show&&0};
function sync(){
  if(locked||!AUTH)return;
  if(lg('nb.me')!==AUTH.n||lg('ms.me')!==AUTH.n){
    ls('nb.me',AUTH.n);ls('ms.me',AUTH.n);
    K.forEach(function(x){loaded[x]=0;$('f-'+x).srcdoc=''});
    seen={};firstDone=false;pend=[];hidePop();show(cur);if(cur!=='todo')load('todo')}
}
setInterval(sync,1000);
window.addEventListener('storage',sync);
/* ---- 내 할 일 알림 ---- */
var seen={},firstDone=false,pend=[],newIds={},dismissed=false;
function dday(s){var t=new Date();var a=Date.parse(s+'T00:00:00Z'),b=Date.parse(t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')+'T00:00:00Z');return Math.round((a-b)/864e5)}
function showPop(){
  if(locked||!pend.length){hidePop();return}
  var late=pend.filter(function(t){return t.due&&dday(t.due)<0}).length;
  $('nt').textContent='🔔 '+lg('nb.me')+'님의 할 일 '+pend.length+'건'+(late?' · 기한 초과 '+late+'건':'');
  $('np').classList.toggle('late',late>0);
  var ST=['대기','진행 중'],PR={h:'높음',m:'보통',l:'낮음'};
  $('nl').innerHTML=pend.slice(0,30).map(function(t){
    var d=t.due?dday(t.due):null,dt=t.due?(d<0?'<span class="l">'+(-d)+'일 초과</span>':d===0?'<span class="s">오늘까지</span>':d<=2?'<span class="s">D-'+d+'</span>':'D-'+d)+' ('+t.due.slice(5)+')':'마감 없음';
    return '<li><div class="t">'+(newIds[t.id]?'<span class="nw">NEW</span>':'')+'<span>'+esc(t.title)+'</span></div><div class="m">'+dt+' · '+ST[t.st]+' · 우선순위 '+PR[t.pr||'m']+(t.by&&t.by!==t.to?' · 지시 '+esc(t.by):'')+'</div></li>'}).join('')+(pend.length>30?'<li class="m">외 '+(pend.length-30)+'건</li>':'');
  $('np').classList.add('on');
}
function hidePop(){$('np').classList.remove('on')}
$('nx').onclick=$('nc').onclick=function(){dismissed=true;newIds={};hidePop()};
$('ng').onclick=$('nl').onclick=function(){show('todo');dismissed=true;newIds={};hidePop()};
var lastT=null;
window.kpiNotify=function(T){
  lastT=T;var me=lg('nb.me');if(locked||!me)return;
  var P=(T||[]).filter(function(t){return t&&t.to===me&&t.st!==2});
  var tk=function(t){return t.due||'9999'};
  P.sort(function(x,y){return tk(x)<tk(y)?-1:tk(x)>tk(y)?1:(y.cr||0)-(x.cr||0)});
  pend=P;
  var fresh=P.filter(function(t){return !seen[t.id]});
  P.forEach(function(t){seen[t.id]=1});
  if(!firstDone){firstDone=true;newIds={};dismissed=false;if(P.length)showPop();return}
  var nw=fresh.filter(function(t){return t.by!==me});
  if(nw.length){nw.forEach(function(t){newIds[t.id]=1});dismissed=false;showPop()}
  else if($('np').classList.contains('on'))showPop();
};

/* ---- 관리자 전용: 새 HTML 만들기 ---- */
function isAdm(){return !!AUTH&&(AUTH.r==='admin'||AUTH.r==='master')}
function adm(){$('mk').hidden=locked||!isAdm()}
function tip(m){var e=$('tt');e.textContent=m;e.classList.add('on');clearTimeout(tip.t);tip.t=setTimeout(function(){e.classList.remove('on')},4200)}
function wait(f,ms){return new Promise(function(res){var t0=Date.now();(function g(){var v;try{v=f()}catch(e){v=0}if(v||Date.now()-t0>ms)res(v);else setTimeout(g,200)})()})}
function ymd(){var d=new Date();return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')}
function blobJ(h){return JSON.stringify(h).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029')}
$('mk').onclick=async function(){
  if(locked||!isAdm())return;
  var btn=$('mk'),old=btn.innerHTML;btn.disabled=true;btn.textContent='만드는 중…';
  try{
    load('sales');
    var w=$('f-sales').contentWindow;
    await wait(function(){return w.kpiBake&&w.kpiReady&&w.kpiReady()},15000);
    if(!(w.kpiBake&&w.kpiReady())){tip('실시간 동기화가 끝나지 않아 만들지 못했습니다. 연결 상태를 확인한 뒤 다시 시도하세요.');return}
    var r=w.kpiBake();
    var c=document.documentElement.cloneNode(true);
    c.querySelectorAll('iframe').forEach(function(f){f.removeAttribute('srcdoc')});
    c.querySelector('#gate').className='';c.querySelector('#np').className='';c.querySelector('.shell').removeAttribute('inert');
    c.querySelector('#tt').className='';c.querySelector('#mk').setAttribute('hidden','');
    var HIDE='<style id="kpi-hide">.top .ttl .eyebrow,.top .ttl h1{display:none!important}.top{align-items:center}</style>';
    var sales=r.html,bi=sales.indexOf('<body>')+6;sales=sales.slice(0,bi)+HIDE+sales.slice(bi);
    var six=JSON.parse(c.querySelector('#p-six').textContent);
    six=six.replace(/const SALES_COLL='[^']*',SALES_ASOF='[^']*';/,function(){return "const SALES_COLL='"+r.coll+"',SALES_ASOF='"+r.date.replace(/-/g,'.')+"';"});
    six=six.replace(/const SB=(\{[^\n]*\});(?=\nconst SO=)/,function(m,j){var o=JSON.parse(j);Object.keys(o).forEach(function(k){if(r.sb[k])o[k]=Object.assign({},o[k],r.sb[k])});return 'const SB='+JSON.stringify(o)+';'});
    c.querySelector('#p-sales').textContent=blobJ(sales);
    c.querySelector('#p-six').textContent=blobJ(six);
    var out='<!doctype html>\n'+c.outerHTML;
    var fn='납기_관리_KPI_'+ymd()+'.html';
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'text/html;charset=utf-8'}));a.download=fn;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
    tip('저장했습니다 — '+fn+' · 이 파일로 교체하면 지금 매출 값이 기준값이 됩니다.');
  }catch(e){console.error(e);tip('만들지 못했습니다.')}
  finally{btn.disabled=false;btn.innerHTML=old}
};
/* ---- 시작: 항상 To Do List, 사용자 선택 필수 ---- */
lock();
})();
